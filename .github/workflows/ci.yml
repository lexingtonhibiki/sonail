name: Sonail CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build:shared
      - run: npx playwright install --with-deps chromium
        working-directory: packages/e2e
      # Cleanup contracts inspect /proc. Keep their real OS permission check;
      # an unreadable process must continue to block cleanup in the product.
      - name: Server and integration contracts
        run: sudo env "PATH=$PATH" "HOME=$HOME" node scripts/run-contract-tests.cjs
      - name: Builds and browser tests
        run: node scripts/run-required-gate.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: test-results
          path: packages/e2e/test-results/
