name: Sonail CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build:shared
      - run: npx playwright install --with-deps chromium
        working-directory: packages/e2e
      # Cleanup contracts inspect /proc. Keep their real OS permission check;
      # an unreadable process must continue to block cleanup in the product.
      - name: Server and integration contracts
        run: sudo env "PATH=$PATH" "HOME=$HOME" node scripts/run-contract-tests.cjs
      - name: Builds and browser tests
        run: node scripts/run-required-gate.cjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: packages/e2e/test-results/
